<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<link rel="stylesheet" type="text/css" href="style.css">
<title>Quiz 1</title>

</head>
<body>
<div class="container text-center mt-5">

<h1>JAVASCRIPT OPERATORS</h1>


<div class="container text-center mt-3 ">
    <h5><b>Given: If A = 24.18 and B = 7.18, compute for the following:<b></h5>
</div>
</br>
    
    <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <h5>Arithmetic Operators</h5>
                    <p>Exponent: <span id="exp-answer"></span></p>
                    <p>Modulus: <span id="mod-answer"></span></p>
                    <button class="btn btn-warning" onclick="
                        var A = 24.18, B = 7.18;
                        document.getElementById('exp-answer').innerHTML = Math.pow(A, B).toFixed(2);
                        document.getElementById('mod-answer').innerHTML = (A % B).toFixed(2);">
                        Show Answer
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <h5>Comparison Operators</h5>
                    <p>Is 24.18 greater than 7.18? <span id="greater-answer"></span></p>
                    <p>Is 24.18 equal to 7.18? <span id="equal-answer"></span></p>
                    <button class="btn btn-warning" onclick="
                        var num1 = 24.18, num2 = 7.18;
                        document.getElementById('greater-answer').innerHTML = num1 > num2;
                        document.getElementById('equal-answer').innerHTML = num1 == num2;">
                        Show Answer
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <h5>Logical Operators</h5>
                    <p>(A <= B) && (A >= B): <span id="logical1-answer"></span></p>
                    <p>(A != B) || (A == B): <span id="logical2-answer"></span></p>
                    <button class="btn btn-warning" onclick="
                        var A = 24.18, B = 7.18;
                        document.getElementById('logical1-answer').innerHTML = (A <= B) && (A >= B);
                        document.getElementById('logical2-answer').innerHTML = (A != B) || (A == B);">
                        Show Answer
                    </button>
                </div>
            </div>
        </div>

        <button class="btn btn-success mt-4" onclick="location.reload()">Refresh</button>
    </div>

</script>
</body>
</html>
